<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hidden Bogotá{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="navbar">
        <a href="{{ url_for('index') }}" class="brand">📍 Hidden <span>Bogotá</span></a>
        <nav class="nav-links">
            <a href="{{ url_for('index') }}#como-funciona">Cómo funciona</a>
            <a href="{{ url_for('index') }}#destacado">Explorar</a>
            <a href="{{ url_for('login_comercio') }}">Para comercios</a>
        </nav>
        <div class="nav-actions">
            <a href="{{ url_for('login_turista') }}" class="btn btn-outline">Iniciar sesión</a>
            <a href="{{ url_for('login_turista') }}" class="btn btn-primary">Registrarme</a>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Hidden Bogotá · Descubre lo que no todos conocen</p>
    </footer>
</body>
</html>
